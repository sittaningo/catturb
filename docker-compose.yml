services:
  rstudio:
    build:
      context: .
    environment:
      - TZ=Asia/Tokyo
      - DISABLE_AUTH=true
      - PYTHONUSERBASE=/home/rstudio/.pip
    ports:
      - "8787:8787"
    volumes:
      - .:/home/rstudio/work
      - renv:/home/rstudio/.cache/R/renv
      - pip:/home/rstudio/.pip
      - julia:/home/rstudio/.julia
      # TinyTeX ボリュームは不要になったため削除
      - fonts:/usr/share/fonts

volumes:
  renv:
    external: true
  pip:
    external: true
  julia:
    external: true
  fonts:
    external: true